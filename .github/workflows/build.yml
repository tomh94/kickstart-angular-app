name: Build

on:
  push:
    branches:
      - "main"
  pull_request:


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Biome check
        run: npm run biome:ci

      - name: ESLint
        run: npm run lint
